        } from './heart-density.js';

        const IS_MOBILE = window.matchMedia("(max-width: 640px)").matches;
        const IS_COMPACT = window.innerHeight < 650;

        // --- 核心配置 ---
        const CONFIG = {
            colors: {
                bg: 0x000000,
                fog: 0x000000,
                ice: 0xc9f4ff,
                heartPink: 0xff85c2
            },
            particles: {
                treePoints: IS_MOBILE ? 32000 : 50000,
                groundPoints: IS_MOBILE ? 2600 : 4000,
                starPoints: IS_MOBILE ? 800 : 1200,
                heartPoints: IS_MOBILE ? 700 : 1000,

                treeRadius: IS_COMPACT ? 7.5 : 8.4,

        const STATE = {

            focusTarget: null,
            hand: { detected: false, x: 0, y: 0 },
            rotation: { x: 0, y: 0 },

        };

        let scene, camera, renderer, composer, bloomPassEffect;
        let mainGroup;
        let clock = new THREE.Clock();
        let particleSystem = [];
        let treeCloud;
        let treeCloudMaterial;
        let heartSprite;
        let groundCloud;
        let scatterMix = 0;
        let photoMeshGroup = new THREE.Group();
        let handLandmarker, video, mediaPipeModule;
        let activeCameraStream = null;
        let cameraStartPromise = null;
        let modelLoadPromise = null;
        let isPredictionRunning = false;
        let caneTexture;
        let snowSystem;
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();

        const camBtn = document.getElementById('cam-btn');

        const musicToggle = document.getElementById('music-toggle');
        const musicLabel = document.getElementById('music-label');

        // 全局暴露给HTML按钮调用
        window.setMode = (mode) => {
            if (mode === 'FOCUS_RANDOM') {
                STATE.mode = 'FOCUS';
                const photos = particleSystem.filter(p => p.type === 'PHOTO');
                if (photos.length) STATE.focusTarget = photos[Math.floor(Math.random()*photos.length)].mesh;
            } else {
                STATE.mode = mode;
                if (mode === 'TREE') STATE.focusTarget = null;
            }
        };

// <!--
//   - @Project: Grand Luxury Tree - Christmas Edition (Touch & Gesture & Stats)
//   - @Author: wp/electronicminer

//   - @Description: 3D Christmas tree with AI Gestures + Touch + Traffic Analytics.
//   - @Style: Luxury Dashboard UI (Hidden by default, toggle with 'S')
// -->
        function setupTouchAndClick() {
            const container = document.getElementById('canvas-container');
            container.addEventListener('pointerdown', (e) => {
                STATE.touch.active = true;
                STATE.touch.startX = e.clientX;
                STATE.touch.startY = e.clientY;
                STATE.touch.lastX = e.clientX;
                STATE.touch.lastY = e.clientY;
            });
            window.addEventListener('pointermove', (e) => {
                if (!STATE.touch.active) return;
                const deltaX = e.clientX - STATE.touch.lastX;
                const deltaY = e.clientY - STATE.touch.lastY;
                STATE.rotation.y += deltaX * 0.005;
                STATE.rotation.x += deltaY * 0.002;
                STATE.rotation.x = Math.max(-0.5, Math.min(0.5, STATE.rotation.x));
                STATE.touch.lastX = e.clientX;
                STATE.touch.lastY = e.clientY;
            });
            window.addEventListener('pointerup', (e) => {
                STATE.touch.active = false;
            });
            container.addEventListener('click', (e) => {
                const moveDist = Math.hypot(e.clientX - STATE.touch.startX, e.clientY - STATE.touch.startY);
                if (moveDist > 10) return;
                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
                raycaster.setFromCamera(mouse, camera);

        class Particle {
            constructor(mesh, type, isDust = false) {

                this.posTree = new THREE.Vector3(); this.posScatter = new THREE.Vector3();

                this.treePhase = Math.random() * Math.PI * 2;
                this.treeStyle = Math.random();

                this.calculatePositions();
            }
            calculatePositions() {
                if (this.type === 'PHOTO') {
                    this.posTree.set(0, 0, 0);
                    const rScatter = 6.5 + Math.random()*5.5;
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.acos(2 * Math.random() - 1);
                    this.posScatter.set(rScatter * Math.sin(phi) * Math.cos(theta), rScatter * Math.sin(phi) * Math.sin(theta), rScatter * Math.cos(phi));
                    return;
                }
                const h = CONFIG.particles.treeHeight;
                const tierCount = CONFIG.particles.tierCount;
                const tierProgress = Math.pow(Math.random(), 0.74);
                const normalizedHeight = Math.min(
                    0.985,
                    (this.treeTier + tierProgress) / tierCount
                );
                const radiusAtLevel =
                    CONFIG.particles.treeRadius *
                    Math.pow(normalizedHeight, 0.9);
                const branchFlare =
                    0.86 +
                    0.14 * (1 - tierProgress) +
                    0.025 * Math.cos(this.treePhase);
                let radialBias;
                let angle;
                if (this.treeStyle < 0.7) {
                    angle = this.treeAngle;
                    radialBias = 0.7 + Math.random() * 0.3;
                } else if (this.treeStyle < 0.88) {
                    angle =
                        normalizedHeight * Math.PI * 5.4 +
                        this.treeTier * 0.42 +
                        this.treePhase * 0.08;
                    radialBias = 0.74 + Math.random() * 0.2;
                } else {
                    angle = this.treeAngle;
                    radialBias = 0.12 + Math.random() * 0.58;
                }
                const radius = radiusAtLevel * branchFlare * radialBias;
                const branchSag =
                    (Math.random() - 0.5) *
                    (h / tierCount) *
                    (0.18 + radialBias * 0.22);
                const y = h / 2 - normalizedHeight * h + branchSag;
                this.posTree.set(
                    Math.cos(angle) * radius,
                    y,
                    Math.sin(angle) * radius

                let rScatter = this.isDust ? (12 + Math.random()*20) : (8 + Math.random()*12);
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                this.posScatter.set(rScatter * Math.sin(phi) * Math.cos(theta), rScatter * Math.sin(phi) * Math.sin(theta), rScatter * Math.cos(phi));

            update(dt, mode, focusTargetMesh) {

                if (mode === 'FOCUS' && this.mesh === focusTargetMesh) this.mesh.lookAt(camera.position);
                let s = this.baseScale;

                    s = this.baseScale * (0.8 + 0.4 * Math.sin(clock.elapsedTime * 4 + this.mesh.id));
                    if (mode === 'TREE') s = 0;

                else if (mode === 'FOCUS') {
                    if (this.mesh === focusTargetMesh) s = 4.5; else s = this.baseScale * 0.8;

        }

            const color = new THREE.Color();

            const mapScale = 1.58;

            const sourceCenterY = 6.1;

            const heartDensity = new Uint8Array(
                HEART_DENSITY_WIDTH * HEART_DENSITY_HEIGHT

            const heartDensityCumulative = new Uint32Array(
                HEART_DENSITY_WIDTH * HEART_DENSITY_HEIGHT

            let heartDensityTotal = 0;
            let densityIndex = 0;
            for (const row of HEART_DENSITY_ROWS) {
                for (const value of row) {
                    const densityValue = parseInt(value, 16);
                    heartDensity[densityIndex] = densityValue;
                    heartDensityTotal += densityValue;
                    heartDensityCumulative[densityIndex] =
                        heartDensityTotal;
                    densityIndex += 1;
                }
            }

            function sampleHeartVolume() {
                const target = Math.random() * heartDensityTotal;
                let low = 0;
                let high = heartDensityCumulative.length - 1;
                while (low < high) {
                    const middle = (low + high) >> 1;
                    if (heartDensityCumulative[middle] > target) high = middle;
                    else low = middle + 1;
                }
                const cellX = low % HEART_DENSITY_WIDTH;
                const cellY = Math.floor(low / HEART_DENSITY_WIDTH);
                const localDensity = heartDensity[low] / 15;
                const normalizedX =
                    ((cellX + Math.random()) / HEART_DENSITY_WIDTH) * 2 - 1;
                const normalizedY =
                    1 - ((cellY + Math.random()) / HEART_DENSITY_HEIGHT) * 2;
                const depth = Math.random() * 2 - 1;
                const roundedLayer = Math.sqrt(
                    Math.max(0.025, 1 - depth * depth)

                    toneMapped: false
                })
            );
            heartSprite.position.set(0, 11.6, 0);
            heartSprite.scale.set(6.8, 6.8, 1);
            mainGroup.add(heartSprite);

            const groundPositions = [];
            const groundColors = [];
            const rings = [4.6, 6.0, 7.4, 8.8, 10.2, 11.4];
            for (let i = 0; i < CONFIG.particles.groundPoints; i += 1) {
                const ring = rings[Math.floor(Math.random() * rings.length)];
                const radius = Math.max(0, ring + (Math.random() - 0.5) * 0.7);
                const angle = Math.random() * Math.PI * 2;
                groundPositions.push(
                    Math.cos(angle) * radius * mapScale,
                    (-0.25 - sourceCenterY) * 2,
                    Math.sin(angle) * radius * mapScale
                );
                const channel = Math.random() < 0.15
                    ? 235 + Math.floor(Math.random() * 21)
                    : 190 + Math.floor(Math.random() * 46);
                color.setRGB(channel / 255, channel / 255, 1, THREE.SRGBColorSpace);
                groundColors.push(color.r, color.g, color.b);
            }
            const groundGeometry = new THREE.BufferGeometry();
            groundGeometry.setAttribute(
                "position",
                new THREE.Float32BufferAttribute(groundPositions, 3)
            );
            groundGeometry.setAttribute(
                "color",
                new THREE.Float32BufferAttribute(groundColors, 3)
            );
            const groundMaterial = new THREE.PointsMaterial({
                size: 0.16,
                map: particleTexture,
                vertexColors: true,
                transparent: true,
                opacity: 0.76,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                sizeAttenuation: true,
                toneMapped: false,
                fog: false
            });
            groundCloud = new THREE.Points(groundGeometry, groundMaterial);
            mainGroup.add(groundCloud);

            const starPositions = [];
            const starColors = [];
            for (let i = 0; i < CONFIG.particles.starPoints; i += 1) {
                const x = Math.random() * 36 - 18;
                const y = 3 + Math.random() * 15;
                const z = Math.random() * 36 - 18;
                starPositions.push(
                    x * mapScale,
                    (y - sourceCenterY) * 2,
                    z * mapScale
                );
                const base = (215 + Math.floor(Math.random() * 41)) / 255;
                color.setRGB(base, base, 1, THREE.SRGBColorSpace);
                starColors.push(color.r, color.g, color.b);
            }
            const starGeometry = new THREE.BufferGeometry();
            starGeometry.setAttribute(
                "position",
                new THREE.Float32BufferAttribute(starPositions, 3)
            );
            starGeometry.setAttribute(
                "color",
                new THREE.Float32BufferAttribute(starColors, 3)
            );
            const starMaterial = new THREE.PointsMaterial({
                size: 0.22,
                map: particleTexture,
                vertexColors: true,
                transparent: true,
                opacity: 0.62,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                sizeAttenuation: true,
                toneMapped: false,
                fog: false
            });
            mainGroup.add(new THREE.Points(starGeometry, starMaterial));
            mainGroup.add(photoMeshGroup);
        }

        function addPhotoToScene(texture) {
            const frameGeo = new THREE.BoxGeometry(1.4, 1.4, 0.05);
            const frameMat = new THREE.MeshStandardMaterial({ color: 0xffcfe5, metalness: 0.65, roughness: 0.22 });
            const frame = new THREE.Mesh(frameGeo, frameMat);
            let width = 1.2; let height = 1.2;
            if (texture.image) {
                const aspect = texture.image.width / texture.image.height;
                if (aspect > 1) height = width / aspect; else width = height * aspect;
            }
            const photoGeo = new THREE.PlaneGeometry(width, height);
            const photoMat = new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide });
            const photo = new THREE.Mesh(photoGeo, photoMat);
            photo.position.z = 0.04;
            const group = new THREE.Group();
            group.add(frame); group.add(photo);
            frame.scale.set(width/1.2, height/1.2, 1);
            const s = 0.8; group.scale.set(s,s,s);
            photoMeshGroup.add(group);
            particleSystem.push(new Particle(group, 'PHOTO', false));
            updatePhotoLayout();
        }

        function handleImageUpload(e) {
            const files = e.target.files;
            if(!files.length) return;
            Array.from(files).forEach(f => {
                if (!f.type.startsWith('image/')) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    new THREE.TextureLoader().load(ev.target.result, (t) => {
                        t.colorSpace = THREE.SRGBColorSpace;
                        addPhotoToScene(t);
                    });
                }
                reader.readAsDataURL(f);
            });
        }

        function loadPredefinedImages() {

                for (let i = 1; i <= CONFIG.preload.scanCount; i++) {
                    const pathJpg = `./images/(${i}).jpg`;

                    loader.load(pathJpg, (t) => { t.colorSpace = THREE.SRGBColorSpace; addPhotoToScene(t); }, undefined, () => {
                             loader.load(pathPng, (t) => { t.colorSpace = THREE.SRGBColorSpace; addPhotoToScene(t); }, undefined, () => {} );

                }
            }
        }

        function showMsg(txt) {
            const box = document.getElementById('msg-box');
            box.innerText = txt; box.style.display = 'block';
            setTimeout(() => { box.style.display = 'none'; }, 3000);
        }

        function updateCountdown() {
            const output = document.getElementById('countdown-line');
            if (!output) return;
            const now = new Date();
            let year = now.getFullYear();
            let target = new Date(year, 11, 25, 0, 0, 0, 0);
            const christmasEnd = new Date(year, 11, 26, 0, 0, 0, 0);

            if (now >= christmasEnd) {
                year += 1;
                target = new Date(year, 11, 25, 0, 0, 0, 0);
            }

            if (now >= target && now < christmasEnd) {
                output.innerHTML = "圣诞快乐 · <strong>Merry Christmas</strong>";
                return;
            }

            const remaining = Math.max(0, target - now);
            const days = Math.floor(remaining / 86400000);
            const hours = Math.floor((remaining / 3600000) % 24);
            const minutes = Math.floor((remaining / 60000) % 60);
            const seconds = Math.floor((remaining / 1000) % 60);
            const pad = value => String(value).padStart(2, "0");
            output.innerHTML =
                `距离 ${year} 圣诞节 · <strong>${days} 天 ${pad(hours)}:${pad(minutes)}:${pad(seconds)}</strong>`;
        }

        function setMusicState(state) {
            if (!musicToggle || !musicLabel) return;
            musicToggle.classList.toggle("is-playing", state === "playing");
            musicToggle.classList.toggle("is-pending", state === "pending");
            musicToggle.setAttribute(
                "aria-pressed",
                state === "playing" ? "true" : "false"
            );
            musicToggle.setAttribute(
                "aria-label",
                state === "playing" ? "暂停背景音乐" : "播放背景音乐"
            );
            if (state === "playing") musicLabel.textContent = "音乐开启";
            else if (state === "pending") musicLabel.textContent = "音乐加载中";
            else if (state === "error") musicLabel.textContent = "音乐加载失败";
            else musicLabel.textContent = "开启音乐";
        }

        async function startMusic() {
            if (!backgroundMusic || !backgroundMusic.paused) return;
            if (musicRequest) return musicRequest;
            setMusicState("pending");
            backgroundMusic.volume = 0.68;
            musicRequest = backgroundMusic.play()
                .then(() => setMusicState("playing"))
                .catch((error) => {
                    console.warn("Background music could not start:", error);
                    setMusicState("error");
                })
                .finally(() => {
                    musicRequest = null;
                });
            return musicRequest;
        }

        function setupMusic() {
            if (!backgroundMusic || !musicToggle) return;
            musicToggle.addEventListener("click", (event) => {
                event.stopPropagation();
                if (backgroundMusic.paused) startMusic();
                else backgroundMusic.pause();
            });
            backgroundMusic.addEventListener("play", () => setMusicState("playing"));
            backgroundMusic.addEventListener("pause", () => setMusicState("idle"));
            backgroundMusic.addEventListener("error", () => setMusicState("error"));
            document.addEventListener("pointerdown", (event) => {
                if (event.target.closest("#music-toggle")) return;
                if (backgroundMusic.paused) startMusic();
            }, { once: true, capture: true });
        }

        function withTimeout(promise, milliseconds, message) {
            let timer;
            return Promise.race([
                promise,
                new Promise((_, reject) => {
                    timer = setTimeout(
                        () => reject(new Error(message)),
                        milliseconds
                    );
                })
            ]).finally(() => clearTimeout(timer));
        }

        function getUserMediaCompat(constraints) {
            if (
                navigator.mediaDevices &&
                typeof navigator.mediaDevices.getUserMedia === "function"
            ) {
                return navigator.mediaDevices.getUserMedia(constraints);
            }
            const legacyGetUserMedia =
                navigator.getUserMedia ||
                navigator.webkitGetUserMedia ||
                navigator.mozGetUserMedia;
            if (!legacyGetUserMedia) {
                return Promise.reject(
                    new Error("当前浏览器不支持摄像头接口")
                );
            }
            return new Promise((resolve, reject) => {
                legacyGetUserMedia.call(
                    navigator,
                    constraints,
                    resolve,
                    reject
                );
            });
        }

        function cameraErrorMessage(error) {
            if (
                !window.isSecureContext &&
                location.hostname !== "localhost" &&
                location.hostname !== "127.0.0.1"
            ) {
                return "摄像头只能在 HTTPS 页面中启用";
            }
            switch (error && error.name) {
                case "NotAllowedError":
                case "PermissionDeniedError":
                    return "摄像头权限被拒绝，请在微信设置中允许摄像头后重试";
                case "NotFoundError":
                case "DevicesNotFoundError":
                    return "未检测到可用摄像头";
                case "NotReadableError":
                case "TrackStartError":
                    return "摄像头被其他应用占用，请关闭后重试";
                case "OverconstrainedError":
                    return "当前摄像头不支持所需分辨率";
                case "SecurityError":
                    return "当前页面安全策略禁止访问摄像头";
                default:
                    return (
                        (error && error.message) ||
                        "摄像头启用失败，请重试"
                    );
            }
        }

        async function ensureGestureModel() {
            if (handLandmarker) {
                startPredictionLoop();
                return;
            }
            if (modelLoadPromise) return modelLoadPromise;

            modelLoadPromise = (async () => {
                debugInfo.innerText = "摄像头已开启 · 正在加载手势识别";
                camBtn.innerText = "Loading Gesture...";
                try {
                    if (!mediaPipeModule) {
                        mediaPipeModule = await withTimeout(
                            import("@mediapipe/tasks-vision"),
                            18000,
                            "手势识别组件加载超时"
                        );
                    }
                    const { FilesetResolver, HandLandmarker } =
                        mediaPipeModule;
                    const vision = await withTimeout(
                        FilesetResolver.forVisionTasks(
                            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
                        ),
                        18000,
                        "手势识别运行环境加载超时"
                    );
                    const options = {
                        baseOptions: {
                            modelAssetPath:
                                "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
                            delegate: "GPU"
                        },
                        runningMode: "VIDEO",
                        numHands: 1
                    };
                    try {
                        handLandmarker = await withTimeout(
                            HandLandmarker.createFromOptions(vision, options),
                            18000,
                            "手势识别模型加载超时"
                        );
                    } catch (gpuError) {
                        console.warn(
                            "GPU gesture model failed, retrying with CPU.",
                            gpuError
                        );
                        options.baseOptions.delegate = "CPU";
                        handLandmarker = await withTimeout(
                            HandLandmarker.createFromOptions(vision, options),
                            22000,
                            "手势识别模型加载超时"
                        );
                    }
                    camBtn.innerText = "Gesture Active";
                    camBtn.classList.add("active");
                    debugInfo.innerText =
                        "摄像头与手势识别已开启 · 张开手掌试试";
                    startPredictionLoop();
                } catch (modelError) {
                    console.warn("Gesture model error:", modelError);
                    camBtn.innerText = "Camera On";
                    camBtn.classList.add("active");
                    debugInfo.innerText =
                        "摄像头已开启 · 手势模型暂不可用，可继续触控";
                    showMsg(
                        "摄像头已开启。手势模型加载失败，但触控功能仍可正常使用。"
                    );
                } finally {
                    modelLoadPromise = null;
                }
            })();
            return modelLoadPromise;
        }

        async function initMediaPipe() {
            if (cameraStartPromise) return cameraStartPromise;
            if (isCameraRunning) {
                if (!handLandmarker) ensureGestureModel();
                return;
            }

            cameraStartPromise = (async () => {
                camBtn.innerText = "Requesting Camera...";
                camBtn.classList.remove("active");
                debugInfo.innerText =
                    "正在请求摄像头权限，请在弹窗中选择允许";
                video = document.getElementById("webcam");

                try {
                    if (activeCameraStream) {
                        activeCameraStream
                            .getTracks()
                            .forEach(track => track.stop());
                    }
                    activeCameraStream = await getUserMediaCompat({
                        audio: false,
                        video: {
                            facingMode: { ideal: "user" },
                            width: { ideal: 640 },
                            height: { ideal: 480 }
                        }
                    });
                    video.muted = true;
                    video.autoplay = true;
                    video.playsInline = true;
                    video.setAttribute("playsinline", "");
                    video.setAttribute("webkit-playsinline", "");
                    video.srcObject = activeCameraStream;
                    document
                        .getElementById("webcam-wrapper")
                        .classList.remove("ui-hidden");
                    document.getElementById("webcam-wrapper").style.opacity = 1;
                    isCameraRunning = true;
                    camBtn.innerText = "Camera On";
                    camBtn.classList.add("active");
                    debugInfo.innerText =
                        "摄像头已开启 · 正在加载手势识别";
                    showMsg("摄像头已开启");

                    try {
                        await video.play();
                    } catch (playError) {
                        console.warn("Video autoplay warning:", playError);
                        video.addEventListener(
                            "loadedmetadata",
                            () => video.play().catch(() => {}),
                            { once: true }
                        );
                    }
                    ensureGestureModel();
                } catch (error) {
                    console.warn("Camera error:", error);
                    isCameraRunning = false;
                    camBtn.innerText = "Retry Camera";
                    camBtn.classList.remove("active");
                    const message = cameraErrorMessage(error);
                    debugInfo.innerText = message;
                    showMsg(message);
                } finally {
                    cameraStartPromise = null;
                }
            })();
            return cameraStartPromise;
        }
// <!--

//   - @Author: wp/electronicminer

        let lastVideoTime = -1;
        function startPredictionLoop() {
            if (isPredictionRunning || !handLandmarker || !video) return;
            isPredictionRunning = true;
            lastVideoTime = -1;
            const predict = async () => {
                if (!isPredictionRunning || !isCameraRunning) return;
                if (video.readyState >= 2 && video.currentTime !== lastVideoTime) {
                    lastVideoTime = video.currentTime;
                    try {
                        const result = handLandmarker.detectForVideo(
                            video,
                            performance.now()
                        );
                        processGestures(result);
                    } catch (error) {
                        console.warn("Gesture detection warning:", error);
                    }
                }
                requestAnimationFrame(predict);
            };
            requestAnimationFrame(predict);
        }

        function processGestures(result) {
            if (result.landmarks && result.landmarks.length > 0) {
                STATE.hand.detected = true;
                const lm = result.landmarks[0];
                STATE.hand.x = (lm[9].x - 0.5) * 2;
                STATE.hand.y = (lm[9].y - 0.5) * 2;
                const wrist = lm[0]; const middleMCP = lm[9];
                const handSize = Math.hypot(middleMCP.x - wrist.x, middleMCP.y - wrist.y);
                if (handSize < 0.02) return;
                const tips = [lm[8], lm[12], lm[16], lm[20]];
                let avgTipDist = 0; tips.forEach(t => avgTipDist += Math.hypot(t.x - wrist.x, t.y - wrist.y)); avgTipDist /= 4;
                const pinchDist = Math.hypot(lm[4].x - lm[8].x, lm[4].y - lm[8].y);
                const extensionRatio = avgTipDist / handSize; const pinchRatio = pinchDist / handSize;
                debugInfo.innerText = `Gesture Detected: ${STATE.mode}`;
                if (extensionRatio < 1.5) { STATE.mode = 'TREE'; STATE.focusTarget = null; }
                else if (pinchRatio < 0.35) {
                    if (STATE.mode !== 'FOCUS') {
                        STATE.mode = 'FOCUS';
                        const photos = particleSystem.filter(p => p.type === 'PHOTO');
                        if (photos.length) STATE.focusTarget = photos[Math.floor(Math.random()*photos.length)].mesh;
                    }
                } else if (extensionRatio > 1.7) { STATE.mode = 'SCATTER'; STATE.focusTarget = null; }
            } else {
                STATE.hand.detected = false;
            }
        }

        function setupEvents() {
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
                composer.setSize(window.innerWidth, window.innerHeight);
            });
            document.getElementById('file-input').addEventListener('change', handleImageUpload);
            document.getElementById('folder-input').addEventListener('change', handleImageUpload);
            camBtn.addEventListener('click', (event) => {
                event.preventDefault();
                event.stopPropagation();
                initMediaPipe();
            });
            window.addEventListener('keydown', (e) => {
                const key = e.key.toLowerCase();
                if (key === 'h') {
                    const controls = document.querySelector('.controls-wrapper');
                    if (controls) controls.classList.toggle('ui-hidden');
                    const webcam = document.getElementById('webcam-wrapper');
                    if(webcam) webcam.classList.toggle('ui-hidden');
                } else if (key === 's') {
                    // 【新增】Toggle stats visibility
                    const stats = document.getElementById('footer-stats');
                    if (stats) stats.classList.toggle('ui-hidden');
                }
            });
        }
// <!--
//   - @Project: Grand Luxury Tree - Christmas Edition (Touch & Gesture & Stats)
//   - @Author: wp/electronicminer
//   - @Date: 2025-12-08
//   - @Description: 3D Christmas tree with AI Gestures + Touch + Traffic Analytics.
//   - @Style: Luxury Dashboard UI (Hidden by default, toggle with 'S')
// -->
        function animate() {
            requestAnimationFrame(animate);
            const dt = clock.getDelta();
            if (STATE.hand.detected) {
                if (STATE.mode === 'SCATTER') {
                    const targetRotY = STATE.hand.x * Math.PI * 0.9;
                    const targetRotX = STATE.hand.y * Math.PI * 0.25;
                    STATE.rotation.y += (targetRotY - STATE.rotation.y) * 3.0 * dt;
                    STATE.rotation.x += (targetRotX - STATE.rotation.x) * 3.0 * dt;
                } else {
                    STATE.rotation.y += 0.3 * dt;
                }
            } else if (STATE.touch.active) {
            } else {
                if(STATE.mode === 'TREE') {
                    STATE.rotation.y += 0.3 * dt;
                    STATE.rotation.x += (0 - STATE.rotation.x) * 2.0 * dt;
                } else {
                    STATE.rotation.y += 0.1 * dt;
                }
            }
            mainGroup.rotation.y = STATE.rotation.y;
            mainGroup.rotation.x = STATE.rotation.x;
            const targetScatterMix = STATE.mode === 'TREE' ? 0 : 1;
            if (targetScatterMix === 1 && scatterMix < 0.01) {
                STATE.rotation.y = 0.34;
                STATE.rotation.x = 0.03;
            }
            scatterMix += (targetScatterMix - scatterMix) * Math.min(1, dt * 3.2);
            if (treeCloudMaterial) {
                treeCloudMaterial.uniforms.uMix.value = scatterMix;
                treeCloudMaterial.uniforms.uTime.value = clock.elapsedTime;
            }
            if (heartSprite) {
                const heartScale = 6.8 * (1 + scatterMix * 0.45);
                heartSprite.scale.set(heartScale, heartScale, 1);
                heartSprite.material.opacity = 1 - scatterMix;
            }
            if (groundCloud) {
                groundCloud.material.opacity = 0.76 * (1 - scatterMix * 0.92);
            }
            if (bloomPassEffect) {
                bloomPassEffect.strength = THREE.MathUtils.lerp(
                    0.58,
                    0.09,
                    scatterMix
                );
                bloomPassEffect.radius = THREE.MathUtils.lerp(
                    0.48,
                    0.28,
                    scatterMix
                );
            }
            particleSystem.forEach(p => p.update(dt, STATE.mode, STATE.focusTarget));
            updateSnow();
            composer.render();
        }
